name: CI Build & Test

on:
  push:
    branches: [ "main", "copilot/**" ]
  pull_request:
    branches: [ "main", "copilot/**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore BOS.slnx

    - name: Build Solution
      run: dotnet build BOS.slnx --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test BOS.slnx --configuration Release --no-build --verbosity normal
