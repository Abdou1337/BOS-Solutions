name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore BOS.slnx

      - name: Build
        run: dotnet build BOS.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test BOS.slnx --no-build --configuration Release --verbosity normal
