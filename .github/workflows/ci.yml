name: CI

on:
  push:
    branches: [ "main", "copilot/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BOS.slnx --ignore-failed-sources || dotnet restore src/BOS.Infrastructure/BOS.Infrastructure.csproj

      - name: Build
        run: dotnet build src/BOS.Infrastructure/BOS.Infrastructure.csproj --no-restore --configuration Release

      - name: Test
        run: |
          if [ -d tests ]; then
            dotnet test tests --no-build --configuration Release --verbosity normal || true
          else
            echo "No test projects found, skipping."
          fi

  build-desktop-windows:
    name: Build BOS.Desktop (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore src/BOS.Desktop/BOS.Desktop.csproj

      - name: Build
        run: dotnet build src/BOS.Desktop/BOS.Desktop.csproj --no-restore --configuration Release -p:Platform=x64
