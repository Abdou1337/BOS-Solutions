name: Windows CI

on:
  push:
    branches: [ main, 'copilot/*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore BOS.slnx

    - name: Build solution
      run: dotnet build BOS.slnx --configuration Release --no-restore

    - name: Run tests
      run: dotnet test BOS.slnx --configuration Release --no-build --verbosity normal
